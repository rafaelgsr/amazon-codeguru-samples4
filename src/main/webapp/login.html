<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
        .login-container { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { margin-bottom: 1.5rem; text-align: center; font-size: 1.5rem; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; color: #555; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.2); }
        button { width: 100%; padding: 0.625rem; background: #0066cc; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #0052a3; }
        button:disabled { background: #999; cursor: not-allowed; }
        .message { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; display: none; }
        .message.error { display: block; background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; }
        .message.success { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #c8e6c9; word-break: break-all; }
    </style>
</head>
<body>
    <main class="login-container">
        <h1>Login</h1>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username" aria-required="true" data-testid="username-input">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" aria-required="true" data-testid="password-input">
            </div>
            <button type="submit" data-testid="login-button">Log In</button>
        </form>
        <div id="message" class="message" role="alert" aria-live="polite" data-testid="message"></div>
    </main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var msgEl = document.getElementById('message');
            var btn = this.querySelector('button');
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;

            msgEl.className = 'message';
            msgEl.textContent = '';

            if (!username || !password) {
                msgEl.className = 'message error';
                msgEl.textContent = 'Please enter both username and password.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in\u2026';

            try {
                var res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();

                if (res.ok) {
                    msgEl.className = 'message success';
                    msgEl.textContent = 'Login successful. Token: ' + data.token;
                } else {
                    msgEl.className = 'message error';
                    msgEl.textContent = data.error || 'Login failed.';
                }
            } catch (err) {
                msgEl.className = 'message error';
                msgEl.textContent = 'Network error. Please try again.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });
    </script>
</body>
</html>
